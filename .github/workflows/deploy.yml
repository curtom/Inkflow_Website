name: Smart Deploy

on:
  push:
    branches:
      - master

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Netlify will auto deploy frontend"

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps: 
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 101.132.131.36
          username: stefan
          port: 2222
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd ~/Inkflow_Website
            git fetch origin
            git reset --hard origin/master

            cd server

            echo "📦 Pre-pull base image"
            docker pull swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mongo:7.0 || true

            echo "💾 Saving current image for rollback..."
            ROLLBACK_IMAGE=$(docker inspect --format='{{.Image}}' inkflow-backend 2>/dev/null || true)
            if [ -n "$ROLLBACK_IMAGE" ]; then
              echo "Rollback checkpoint: $ROLLBACK_IMAGE"
            else
              echo "No existing container found (first deploy, rollback unavailable)"
            fi

            echo "🔨 Build backend"
            docker compose --project-name inkflow build

            echo "🚀 Start services"
            docker compose --project-name inkflow up -d

            echo "⏳ Wait for service..."
            sleep 10

            echo "🧪 Health check"
            if curl -sf http://127.0.0.1:5000/api/v1/health; then
              echo "✅ Deploy successful"
              docker image prune -f
            else
              echo "❌ Health check failed, rolling back..."
              docker compose --project-name inkflow down || true

              if [ -n "$ROLLBACK_IMAGE" ]; then
                echo "🔁 Restoring previous version..."
                docker tag "$ROLLBACK_IMAGE" inkflow-backend:latest
                docker compose --project-name inkflow up -d --no-build
                sleep 5
                curl -sf http://127.0.0.1:5000/api/v1/health \
                  && echo "✅ Service restored successfully" \
                  || echo "⚠️  Rollback service also unhealthy, manual intervention required"
              else
                echo "⚠️  No rollback image available, manual intervention required"
              fi

              exit 1
            fi